
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>그랜드썬 안전마스터</title>
    
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1161/1161388.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; padding: 0;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #loading-screen {
            position: fixed; inset: 0;
            background: #1d4ed8;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; color: white;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #force-skip {
            position: fixed; bottom: 30px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px; border-radius: 20px;
            font-size: 11px; font-weight: 800;
            color: white; cursor: pointer;
            display: none; border: 1px solid rgba(255,255,255,0.3);
            z-index: 10001;
        }
    </style>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react/": "https://esm.sh/react@19.0.0/",
        "react": "https://esm.sh/react@19.0.0",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0",
        "recharts": "https://esm.sh/recharts@2.13.3",
        "@google/genai": "https://esm.sh/@google/genai@0.21.0"
      }
    }
    </script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="font-bold text-lg tracking-tight italic">GRAND SUN</div>
        <div class="text-[10px] opacity-60 mt-2 uppercase tracking-widest">Connecting to Safety System...</div>
        <div id="force-skip" onclick="document.getElementById('loading-screen').remove(); this.remove();">로딩 건너뛰기</div>
    </div>
    
    <div id="root"></div>

    <script type="module" src="index.tsx"></script>

    <script>
        // 3초 후에도 로딩이 안 끝나면 건너뛰기 버튼 표시
        setTimeout(() => {
            const skipBtn = document.getElementById('force-skip');
            if (skipBtn) skipBtn.style.display = 'block';
        }, 3000);

        // 서비스 워커 등록 해제 (오류 방지)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                } 
            });
        }
    </script>
</body>
</html>
